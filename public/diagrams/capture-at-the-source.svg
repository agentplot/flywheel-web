.row{fill:var(--panel);stroke:var(--ok);stroke-width:1.5}
.pick{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:100} .ptip{fill:var(--accent)}
.sig{fill:var(--panel);stroke:var(--ok);stroke-width:1.5}
.ghost{opacity:.55} .gcard{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}
