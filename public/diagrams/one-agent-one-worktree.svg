<!-- One agent, one worktree: drawn for the Flywheel site's Method. Each worktree is a place sluice equips; heads go to sluice's queue, and no worktree merges. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img">
<style>
:root{--bg:#14181f;--panel:#1b2029;--fg:#f2f1ec;--muted:#9a9fab;--rule:#2c323d;--accent:#c9a227;--soft:#232933;--ok:#45c27a;--bad:#f08a7e;--ink:#0e1116}
@media (prefers-color-scheme:light){:root{--bg:#ebe9e2;--panel:#fbfaf7;--fg:#0e1116;--muted:#5d6370;--rule:#d5d2c8;--accent:#7d6110;--soft:#e0ddd4;--ok:#1f8a4c;--bad:#c0392b;--ink:#f2f1ec}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono,.chipt,.slott{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg)} .t{fill:var(--fg)} .m{fill:var(--muted)} .ok{fill:var(--ok)} .bad{fill:var(--bad)}
.b{font-weight:600} .h{font-size:17px;font-weight:700} .hd{font-size:12px;letter-spacing:.06em;fill:var(--muted)}
.sm{font-size:13px} .xs{font-size:11.5px} .mono{font-size:13px} .mono.xs{font-size:11.5px}
.box{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.queue{fill:var(--soft);stroke:none}
.track{fill:var(--soft)}
.fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-dasharray:164}
.div{stroke:var(--rule);stroke-width:1}
.wire{stroke:var(--rule);stroke-width:2}
.edge{stroke:var(--muted);stroke-width:2} .tip{fill:var(--muted)}
.lanel{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5}
.wall{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)} .dotok{fill:var(--ok)}
.chip{fill:var(--accent)} .chipt{fill:var(--ink);font-size:12px;font-weight:700}
.slot{fill:var(--panel);stroke:var(--rule);stroke-width:1.5} .slott{fill:var(--muted);font-size:12px}
.strike{stroke:var(--bad);stroke-width:1.5}
.badge{fill:var(--accent)} .badget{fill:var(--ink);font-size:12px;font-weight:700}
.lnk{fill:var(--accent);text-decoration:underline} .hit{fill:transparent}
a:focus{outline:none} a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:-11.2s!important}
.cap{animation:none!important;opacity:1}}
@keyframes k-wa{0%{stroke-dashoffset:164;stroke:var(--accent);opacity:1} 2%{stroke-dashoffset:164;stroke:var(--accent);opacity:1} 28%{stroke-dashoffset:0;stroke:var(--accent);opacity:1} 28.8%{stroke-dashoffset:0;stroke:var(--ok);opacity:1} 96%{stroke-dashoffset:0;stroke:var(--ok);opacity:1} 97.5%{stroke-dashoffset:0;stroke:var(--ok);opacity:0} 99%{stroke-dashoffset:164;stroke:var(--accent);opacity:0} 100%{stroke-dashoffset:164;stroke:var(--accent);opacity:1}}.wa{animation:k-wa 16s linear infinite}@keyframes k-wb{0%{stroke-dashoffset:164;stroke:var(--accent);opacity:1} 2%{stroke-dashoffset:164;stroke:var(--accent);opacity:1} 56%{stroke-dashoffset:0;stroke:var(--accent);opacity:1} 56.8%{stroke-dashoffset:0;stroke:var(--ok);opacity:1} 96%{stroke-dashoffset:0;stroke:var(--ok);opacity:1} 97.5%{stroke-dashoffset:0;stroke:var(--ok);opacity:0} 99%{stroke-dashoffset:164;stroke:var(--accent);opacity:0} 100%{stroke-dashoffset:164;stroke:var(--accent);opacity:1}}.wb{animation:k-wb 16s linear infinite}@keyframes k-wc{0%{stroke-dashoffset:164;stroke:var(--accent);opacity:1} 2%{stroke-dashoffset:164;stroke:var(--accent);opacity:1} 78%{stroke-dashoffset:0;stroke:var(--accent);opacity:1} 78.8%{stroke-dashoffset:0;stroke:var(--ok);opacity:1} 96%{stroke-dashoffset:0;stroke:var(--ok);opacity:1} 97.5%{stroke-dashoffset:0;stroke:var(--ok);opacity:0} 99%{stroke-dashoffset:164;stroke:var(--accent);opacity:0} 100%{stroke-dashoffset:164;stroke:var(--accent);opacity:1}}.wc{animation:k-wc 16s linear infinite}@keyframes k-bxa{0%{stroke:var(--rule)} 1.2%{stroke:var(--rule)} 2%{stroke:var(--accent)} 28%{stroke:var(--accent)} 28.8%{stroke:var(--ok)} 44.4%{stroke:var(--ok)} 44.8%{stroke:var(--bad)} 50.8%{stroke:var(--bad)} 51.599999999999994%{stroke:var(--ok)} 96%{stroke:var(--ok)} 96.8%{stroke:var(--rule)} 100%{stroke:var(--rule)}}.bxa{animation:k-bxa 16s linear infinite}@keyframes k-bxb{0%{stroke:var(--rule)} 1.2%{stroke:var(--rule)} 2%{stroke:var(--accent)} 56%{stroke:var(--accent)} 56.8%{stroke:var(--ok)} 96%{stroke:var(--ok)} 96.8%{stroke:var(--rule)} 100%{stroke:var(--rule)}}.bxb{animation:k-bxb 16s linear infinite}@keyframes k-bxc{0%{stroke:var(--rule)} 1.2%{stroke:var(--rule)} 2%{stroke:var(--accent)} 78%{stroke:var(--accent)} 78.8%{stroke:var(--ok)} 96%{stroke:var(--ok)} 96.8%{stroke:var(--rule)} 100%{stroke:var(--rule)}}.bxc{animation:k-bxc 16s linear infinite}@keyframes k-cha{0%{opacity:0} 28%{opacity:0} 28.8%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.cha{animation:k-cha 16s linear infinite}@keyframes k-wra{0%{stroke:var(--rule)} 29%{stroke:var(--rule)} 29.6%{stroke:var(--accent)} 35.4%{stroke:var(--accent)} 36.2%{stroke:var(--rule)} 100%{stroke:var(--rule)}}.wra{animation:k-wra 16s linear infinite}@keyframes k-hda{0%{transform:translate(0px,-59px);opacity:0} 29.2%{transform:translate(0px,-59px);opacity:0} 29.6%{transform:translate(0px,-59px);opacity:1} 35%{transform:translate(0px,0px);opacity:1} 35.6%{transform:translate(0px,0px);opacity:0} 100%{transform:translate(0px,0px);opacity:0}}.hda{animation:k-hda 16s linear infinite}@keyframes k-lda{0%{opacity:0} 34.8%{opacity:0} 35.4%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.lda{animation:k-lda 16s linear infinite}@keyframes k-chb{0%{opacity:0} 56%{opacity:0} 56.8%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.chb{animation:k-chb 16s linear infinite}@keyframes k-wrb{0%{stroke:var(--rule)} 57%{stroke:var(--rule)} 57.6%{stroke:var(--accent)} 63.4%{stroke:var(--accent)} 64.2%{stroke:var(--rule)} 100%{stroke:var(--rule)}}.wrb{animation:k-wrb 16s linear infinite}@keyframes k-hdb{0%{transform:translate(0px,-59px);opacity:0} 57.2%{transform:translate(0px,-59px);opacity:0} 57.6%{transform:translate(0px,-59px);opacity:1} 63%{transform:translate(0px,0px);opacity:1} 63.6%{transform:translate(0px,0px);opacity:0} 100%{transform:translate(0px,0px);opacity:0}}.hdb{animation:k-hdb 16s linear infinite}@keyframes k-ldb{0%{opacity:0} 62.8%{opacity:0} 63.4%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.ldb{animation:k-ldb 16s linear infinite}@keyframes k-chc{0%{opacity:0} 78%{opacity:0} 78.8%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.chc{animation:k-chc 16s linear infinite}@keyframes k-wrc{0%{stroke:var(--rule)} 79%{stroke:var(--rule)} 79.6%{stroke:var(--accent)} 85.4%{stroke:var(--accent)} 86.2%{stroke:var(--rule)} 100%{stroke:var(--rule)}}.wrc{animation:k-wrc 16s linear infinite}@keyframes k-hdc{0%{transform:translate(0px,-59px);opacity:0} 79.2%{transform:translate(0px,-59px);opacity:0} 79.6%{transform:translate(0px,-59px);opacity:1} 85%{transform:translate(0px,0px);opacity:1} 85.6%{transform:translate(0px,0px);opacity:0} 100%{transform:translate(0px,0px);opacity:0}}.hdc{animation:k-hdc 16s linear infinite}@keyframes k-ldc{0%{opacity:0} 84.8%{opacity:0} 85.4%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.ldc{animation:k-ldc 16s linear infinite}@keyframes k-lane{0%{opacity:0} 39.6%{opacity:0} 40.2%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.lane{animation:k-lane 16s linear infinite}@keyframes k-rch{0%{transform:translate(38px,-56px);opacity:0;fill:var(--accent)} 40%{transform:translate(38px,-56px);opacity:0;fill:var(--accent)} 40.4%{transform:translate(38px,-56px);opacity:1;fill:var(--accent)} 41.6%{transform:translate(13px,-56px);opacity:1;fill:var(--accent)} 43.6%{transform:translate(13px,0px);opacity:1;fill:var(--accent)} 44.8%{transform:translate(0px,0px);opacity:1;fill:var(--bad)} 96%{transform:translate(0px,0px);opacity:1;fill:var(--bad)} 96.8%{transform:translate(0px,0px);opacity:0;fill:var(--bad)} 100%{transform:translate(0px,0px);opacity:0;fill:var(--bad)}}.rch{animation:k-rch 16s linear infinite}@keyframes k-wl{0%{opacity:0} 44.4%{opacity:0} 44.8%{opacity:1} 96%{opacity:1} 96.4%{opacity:0} 100%{opacity:0}}.wl{animation:k-wl 16s linear infinite}@keyframes k-nd{0%{opacity:0} 45.199999999999996%{opacity:0} 46%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.nd{animation:k-nd 16s linear infinite}@keyframes k-cap1{0%{opacity:0.35} 1.2%{opacity:0.35} 2%{opacity:1} 16%{opacity:1} 16.8%{opacity:0.35} 100%{opacity:0.35}}.cap1{animation:k-cap1 16s linear infinite}@keyframes k-cap2{0%{opacity:0.35} 15.2%{opacity:0.35} 16%{opacity:1} 40%{opacity:1} 40.8%{opacity:0.35} 100%{opacity:0.35}}.cap2{animation:k-cap2 16s linear infinite}@keyframes k-cap3{0%{opacity:0.35} 39.2%{opacity:0.35} 40%{opacity:1} 56%{opacity:1} 56.8%{opacity:0.35} 100%{opacity:0.35}}.cap3{animation:k-cap3 16s linear infinite}@keyframes k-cap4{0%{opacity:0.35} 55.2%{opacity:0.35} 56%{opacity:1} 92%{opacity:1} 92.8%{opacity:0.35} 100%{opacity:0.35}}.cap4{animation:k-cap4 16s linear infinite}</style>
