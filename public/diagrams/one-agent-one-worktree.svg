<!-- One agent, one worktree: drawn for the Flywheel site's Method. Each worktree is a place sluice equips; heads go to sluice's queue, and no worktree merges. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img">
<style>
:root{--bg:#14181f;--panel:#1b2029;--fg:#f2f1ec;--muted:#9a9fab;--rule:#2c323d;--accent:#c9a227;--soft:#232933;--ok:#45c27a;--bad:#f08a7e;--ink:#0e1116}
@media (prefers-color-scheme:light){:root{--bg:#ebe9e2;--panel:#fbfaf7;--fg:#0e1116;--muted:#5d6370;--rule:#d5d2c8;--accent:#7d6110;--soft:#e0ddd4;--ok:#1f8a4c;--bad:#c0392b;--ink:#f2f1ec}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono,.chipt,.slott{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg)} .t{fill:var(--fg)} .m{fill:var(--muted)} .ok{fill:var(--ok)} .bad{fill:var(--bad)}
.b{font-weight:600} .h{font-size:17px;font-weight:700} .hd{font-size:12px;letter-spacing:.06em;fill:var(--muted)}
.sm{font-size:13px} .xs{font-size:11.5px} .mono{font-size:13px} .mono.xs{font-size:11.5px}
.box{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.queue{fill:var(--soft);stroke:none}
.track{fill:var(--soft)}
.fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-dasharray:164}
.div{stroke:var(--rule);stroke-width:1}
.wire{stroke:var(--rule);stroke-width:2}
.edge{stroke:var(--muted);stroke-width:2} .tip{fill:var(--muted)}
.lanel{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5}
.wall{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)} .dotok{fill:var(--ok)}
.chip{fill:var(--accent)} .chipt{fill:var(--ink);font-size:12px;font-weight:700}
.slot{fill:var(--panel);stroke:var(--rule);stroke-width:1.5} .slott{fill:var(--muted);font-size:12px}
.strike{stroke:var(--bad);stroke-width:1.5}
.badge{fill:var(--accent)} .badget{fill:var(--ink);font-size:12px;font-weight:700}
.lnk{fill:var(--accent);text-decoration:underline} .hit{fill:transparent}
a:focus{outline:none} a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<rect class="bg" width="900" height="470" rx="10"/>
<text class="h" x="20" y="32">One agent, one worktree</text>
<text class="m sm" x="240" y="32">each agent works alone, and submits rather than merges</text>
<rect class="queue" x="20" y="282" width="860" height="30" rx="6"/>
<text class="hd" x="32" y="301">THE LINE</text>
<line class="edge" x1="112" y1="297" x2="862" y2="297"/>
<polygon class="tip" points="870,297 861,292 861,302"/>
<text class="m sm" x="32" y="334">sluice’s queue merges and lands each head</text>
<line class="wire wra" x1="218" y1="250" x2="218" y2="297"/>
<text class="m xs" x="226" y="272">head</text>
<rect class="box bxa" x="20" y="50" width="264" height="200" rx="6"/>
<text class="t b" x="34" y="74">worktree a</text>
<text class="mono xs m" x="270" y="74" text-anchor="end">sluice place</text>
<line class="div" x1="34" y1="86" x2="270" y2="86"/>
<text class="m sm" x="34" y="110">agent</text>
<rect class="track" x="106" y="100" width="164" height="10" rx="2"/>
<text class="m sm" x="34" y="138">ports</text>
<rect class="track" x="106" y="123" width="52" height="22" rx="4"/>
<text class="mono t" x="132" y="138" text-anchor="middle">20000</text>
<rect class="track" x="164" y="123" width="52" height="22" rx="4"/>
<text class="mono t" x="190" y="138" text-anchor="middle">20001</text>
<text class="m sm" x="34" y="166">dev server</text>
<text class="mono t" x="106" y="166">:20000</text>
<text class="m sm" x="34" y="194">emulator</text>
<text class="mono t" x="106" y="194">:20001</text>
<line class="div" x1="34" y1="208" x2="270" y2="208"/>
<text class="mono m" x="34" y="231">merge</text>
<line class="strike" x1="30" y1="226.5" x2="78" y2="226.5"/>
<rect class="slot" x="166" y="216" width="104" height="22" rx="4"/>
<text class="slott" x="218" y="231" text-anchor="middle">submit head</text>
<line class="wire wrb" x1="516" y1="250" x2="516" y2="297"/>
<text class="m xs" x="524" y="272">head</text>
<rect class="box bxb" x="318" y="50" width="264" height="200" rx="6"/>
<text class="t b" x="332" y="74">worktree b</text>
<text class="mono xs m" x="568" y="74" text-anchor="end">sluice place</text>
<line class="div" x1="332" y1="86" x2="568" y2="86"/>
<text class="m sm" x="332" y="110">agent</text>
<rect class="track" x="404" y="100" width="164" height="10" rx="2"/>
<text class="m sm" x="332" y="138">ports</text>
<rect class="track" x="404" y="123" width="52" height="22" rx="4"/>
<text class="mono t" x="430" y="138" text-anchor="middle">20002</text>
<rect class="track" x="462" y="123" width="52" height="22" rx="4"/>
<text class="mono t" x="488" y="138" text-anchor="middle">20003</text>
<text class="m sm" x="332" y="166">dev server</text>
<text class="mono t" x="404" y="166">:20002</text>
<text class="m sm" x="332" y="194">emulator</text>
<text class="mono t" x="404" y="194">:20003</text>
<line class="div" x1="332" y1="208" x2="568" y2="208"/>
<text class="mono m" x="332" y="231">merge</text>
<line class="strike" x1="328" y1="226.5" x2="376" y2="226.5"/>
<rect class="slot" x="464" y="216" width="104" height="22" rx="4"/>
<text class="slott" x="516" y="231" text-anchor="middle">submit head</text>
<line class="wire wrc" x1="814" y1="250" x2="814" y2="297"/>
<text class="m xs" x="822" y="272">head</text>
<rect class="box bxc" x="616" y="50" width="264" height="200" rx="6"/>
<text class="t b" x="630" y="74">worktree c</text>
<text class="mono xs m" x="866" y="74" text-anchor="end">sluice place</text>
<line class="div" x1="630" y1="86" x2="866" y2="86"/>
<text class="m sm" x="630" y="110">agent</text>
<rect class="track" x="702" y="100" width="164" height="10" rx="2"/>
<text class="m sm" x="630" y="138">ports</text>
<rect class="track" x="702" y="123" width="52" height="22" rx="4"/>
<text class="mono t" x="728" y="138" text-anchor="middle">20004</text>
<rect class="track" x="760" y="123" width="52" height="22" rx="4"/>
<text class="mono t" x="786" y="138" text-anchor="middle">20005</text>
<text class="m sm" x="630" y="166">dev server</text>
<text class="mono t" x="702" y="166">:20004</text>
<text class="m sm" x="630" y="194">emulator</text>
<text class="mono t" x="702" y="194">:20005</text>
<line class="div" x1="630" y1="208" x2="866" y2="208"/>
<text class="mono m" x="630" y="231">merge</text>
<line class="strike" x1="626" y1="226.5" x2="674" y2="226.5"/>
<rect class="slot" x="762" y="216" width="104" height="22" rx="4"/>
<text class="slott" x="814" y="231" text-anchor="middle">submit head</text>
<g class="cap cap1"><circle class="badge" cx="32" cy="374" r="11"/><text class="badget" x="32" y="378" text-anchor="middle">1</text><text class="t sm" x="50" y="370">Each agent has its own place:</text><text class="t sm" x="50" y="387">ports, emulator and server.</text></g>
<g class="cap cap2"><circle class="badge" cx="250" cy="374" r="11"/><text class="badget" x="250" y="378" text-anchor="middle">2</text><text class="t sm" x="268" y="370">Each works at its own pace,</text><text class="t sm" x="268" y="387">and none waits on another.</text></g>
<g class="cap cap3"><circle class="badge" cx="468" cy="374" r="11"/><text class="badget" x="468" y="378" text-anchor="middle">3</text><text class="t sm" x="486" y="370">Another worktree’s server</text><text class="t sm" x="486" y="387">is out of reach.</text></g>
<g class="cap cap4"><circle class="badge" cx="686" cy="374" r="11"/><text class="badget" x="686" y="378" text-anchor="middle">4</text><text class="t sm" x="704" y="370">Each submits its head; sluice</text><text class="t sm" x="704" y="387">merges and lands it.</text></g>
<line class="div" x1="20" y1="416" x2="880" y2="416"/>
<text class="m sm" x="20" y="442">Worktrunk makes each worktree; sluice gives it its ports and lands its head.</text>
<a href="https://agentplot.github.io/sluice/"><rect class="hit" x="780" y="424" width="104" height="26"/><text class="lnk sm" x="880" y="442" text-anchor="end">sluice’s page ↗</text></a>
</svg>
