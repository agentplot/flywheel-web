text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg)} .t{fill:var(--fg)} .m{fill:var(--muted)} .ok{fill:var(--ok)} .bad{fill:var(--bad)} .acc{fill:var(--accent)}
.b{font-weight:600} .h{font-size:17px;font-weight:700} .hd{font-size:12px;letter-spacing:.06em;fill:var(--muted)}
.sm{font-size:13px} .xs{font-size:11.5px} .mono{font-size:13px} .mono.xs{font-size:11.5px}
.box{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.band{fill:var(--soft);stroke:none}
.div{stroke:var(--rule);stroke-width:1}
.wire{stroke:var(--rule);stroke-width:2}
.dot{fill:var(--accent)}
.badge{fill:var(--accent)} .badget{fill:var(--ink);font-size:12px;font-weight:700}
.lnk{fill:var(--accent);text-decoration:underline} .hit{fill:var(--bg);fill-opacity:0}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:-14.4s!important}
.cap{animation:none!important;opacity:1}}
.trk{fill:none;stroke:var(--soft);stroke-width:18}
.tick{fill:none;stroke:var(--muted);stroke-width:8;stroke-dasharray:.4 5.6;stroke-opacity:.5}
.stn{fill:var(--panel);stroke:var(--rule);stroke-width:2}
.gate{fill:var(--panel);stroke:var(--rule);stroke-width:2.5}
.tok{fill:var(--accent)}
.lead{stroke:var(--rule);stroke-width:1.5}
.slot{fill:var(--panel);stroke:var(--rule);stroke-width:1.5;stroke-dasharray:4 3} .slott{fill:var(--muted);font-size:12px}
.chip{fill:var(--accent)} .chipt{fill:var(--ink);font-size:12px;font-weight:700}
.sign{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .signt{fill:var(--muted);font-size:9px;font-weight:700;letter-spacing:.06em}
.strk{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:100}
.row{fill:var(--soft);stroke:var(--soft);stroke-width:1.5}
.tkl{transform-origin:235px 215px} .tkr{transform-origin:455px 215px}
