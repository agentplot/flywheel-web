<!-- Two loops, one gate: drawn for the Flywheel site's Method. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Two loops, one gate: design and construction are separate loops, and a person decides where they meet</title>
<desc id="dsc">Two rings turn side by side. The design loop carries captures, signals and intents round to a proposal, and the construction loop carries units, merges and bolts round to a landing. The rings touch at the proposal, where the operator's word is given before construction starts. Between the test and the landing, a stop sign is crossed out: sluice lands the bolt on green, with no word. The landing puts a new version on tailrace's beta channel. A second mark lights at the channel's promotion, where the operator's word moves stable to that version.</desc>
<style>
:root{--bg:#14181f;--panel:#1b2029;--fg:#f2f1ec;--muted:#9a9fab;--rule:#2c323d;--accent:#c9a227;--soft:#232933;--ok:#45c27a;--bad:#f08a7e;--ink:#0e1116}
