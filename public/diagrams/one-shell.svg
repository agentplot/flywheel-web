.wire{stroke:var(--rule);stroke-width:2}
.lanel{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5}
.wall{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)} .dotok{fill:var(--ok)}
.chip{fill:var(--accent)} .chipt{fill:var(--ink);font-size:13px;font-weight:700}
.refused{fill:var(--panel);stroke:var(--bad);stroke-width:1.5}
.strike{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:120}
.badge{fill:var(--accent)} .badget{fill:var(--ink);font-size:12px;font-weight:700}
