<!-- One shell: drawn for the Flywheel site's Method. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" role="img" aria-labelledby="ttl dsc">
<title id="ttl">One shell: every command runs in the one shell the repository declares</title>
<desc id="dsc">Four places where work runs: an agent in its worktree, a laptop, CI and a release. Each sends the same command, site-check, into the one shell the repository declares. The devenv shell resolves only the tools it declares, and every place gets back the same verdict from bun 1.4.2, node 24 and vale 3.24.0 alike. Partway through, the agent tries npx vale@latest around the shell, and it is refused because it is not declared.</desc>
