<!-- Intents and bolts: drawn for the Flywheel site's Method. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Intents and bolts: work is an intent, landed in bolts of small units</title>
<desc id="dsc">An intent, one plain sentence of what someone wants, breaks into two bolts, each a body of work landed as one. Each bolt breaks into three units, one reviewable change each. The units drop onto the trunk one at a time, each a small commit, so the trunk grows in small steps. A bolt shows landed once all its units are on the trunk. Below the trunk, a long-lived feature branch of 3,000 lines, which the principle rules out, keeps taking commits but never lands, and is struck through.</desc>
<style>
:root{--bg:#102b2f;--panel:#0d2528;--fg:#ede7da;--muted:#a3b4ae;--rule:#2b4a4d;--accent:#c9a227;--soft:#163a3e;--ok:#8fb9ae;--bad:#e07b4f;--ink:#0d2528}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono,.chipt,.pillt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg)} .t{fill:var(--fg)} .m{fill:var(--muted)} .ok{fill:var(--ok)} .bad{fill:var(--bad)}
.b{font-weight:600} .h{font-size:17px;font-weight:700} .hd{font-size:12px;letter-spacing:.06em;fill:var(--muted)}
.sm{font-size:13px} .xs{font-size:11.5px} .mono{font-size:13px} .q{font-size:15px}
.box{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.conn{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:100} .tip{fill:var(--muted)}
.slot{fill:none;stroke:var(--rule);stroke-width:1.5;stroke-dasharray:4 3}
.chip{fill:var(--accent)} .chipt{fill:var(--ink);font-size:12px;font-weight:700}
.track{stroke:var(--rule);stroke-width:2} .edge{stroke:var(--muted);stroke-width:2}
.commit{fill:var(--muted)} .landed{fill:var(--ok)}
.pill{fill:var(--accent)} .pillt{fill:var(--ink);font-size:12px;font-weight:600}
.ghost{opacity:.55} .gline{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}
.gcommit{fill:var(--bg);stroke:var(--muted);stroke-width:1.5}
.gstrike{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:160}
.badge{fill:var(--accent)} .badget{fill:var(--ink);font-size:12px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:-11.7s!important}
.cap{animation:none!important;opacity:1}}
