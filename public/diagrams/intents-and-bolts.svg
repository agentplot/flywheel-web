<g class="cap cap3"><circle class="badge" cx="468" cy="412" r="11"/><text class="badget" x="468" y="416" text-anchor="middle">3</text><text class="t sm" x="486" y="408">A bolt is units,</text><text class="t sm" x="486" y="425">one reviewable change each.</text></g>
<g class="cap cap4"><circle class="badge" cx="686" cy="412" r="11"/><text class="badget" x="686" y="416" text-anchor="middle">4</text><text class="t sm" x="704" y="408">Small units land on</text><text class="t sm" x="704" y="425">the trunk continuously.</text></g>
