<text class="mono xs m" x="854" y="154" text-anchor="end">••••••</text>
<rect class="row" x="664" y="168" width="202" height="24" rx="4"/>
<text class="mono xs t" x="676" y="184">DATABASE_URL</text>
<text class="mono xs m" x="854" y="184" text-anchor="end">••••••</text>
