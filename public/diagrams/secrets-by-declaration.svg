<text class="mono xs t" x="676" y="214">API_KEY</text>
<text class="mono xs m" x="854" y="214" text-anchor="end">••••••</text>
<g class="pl"><rect class="lit" x="664" y="138" width="202" height="24" rx="4"/><text class="mono xs lt" x="676" y="154">DEPLOY_TOKEN</text><text class="mono xs lt" x="854" y="154" text-anchor="end">••••••</text></g>
<rect class="box ab" x="276" y="76" width="328" height="158" rx="6"/>
<text class="t b" x="290" y="100">agent · worktree</text>
<text class="m xs run" x="590" y="100" text-anchor="end">running…</text>
<text class="ok sm ex" x="590" y="100" text-anchor="end">exit 0</text>
<text class="mono t" x="290" y="122">$ deploy preview</text>
<rect class="track" x="290" y="132" width="300" height="6" rx="3"/>
<rect class="bar cb" x="290" y="132" width="300" height="6" rx="3"/>
<line class="div" x1="290" y1="148" x2="590" y2="148"/>
<text class="m xs" x="290" y="166">for this command alone</text>
<rect class="slot" x="290" y="176" width="300" height="28" rx="4"/>
<text class="mono xs m" x="302" y="194">DEPLOY_TOKEN</text>
<text class="m xs ns" x="578" y="194" text-anchor="end">not set</text>
<text class="m xs gn" x="578" y="194" text-anchor="end">gone when the command ends</text>
<g class="kc"><rect class="chip" x="290" y="176" width="300" height="28" rx="4"/><text class="mono xs chipt" x="302" y="194">DEPLOY_TOKEN=••••••</text><text class="xs chipt" x="578" y="194" text-anchor="end">resolved</text></g>
<text class="m xs" x="290" y="222">resolved from the password manager</text>
<circle class="dot d1" cx="290" cy="190" r="5"/>
<circle class="dot d2" cx="590" cy="190" r="5"/>
<text class="hd" x="20" y="278">NOTHING REACHES</text>
<rect class="box fb" x="20" y="288" width="270" height="60" rx="6"/>
<text class="t b sm" x="34" y="310">a file</text>
<text class="ok xs fn" x="276" y="310" text-anchor="end">no secret</text>
<text class="mono xs m" x="34" y="333">config.yml</text>
<rect class="box eb" x="315" y="288" width="270" height="60" rx="6"/>
<text class="t b sm" x="329" y="310">the wider environment</text>
<text class="ok xs en" x="571" y="310" text-anchor="end">no secret</text>
<text class="m xs" x="329" y="333">the shell beyond this command</text>
<rect class="box tb" x="610" y="288" width="270" height="60" rx="6"/>
<text class="t b sm" x="624" y="310">the transcript</text>
<text class="ok xs tn" x="866" y="310" text-anchor="end">no secret</text>
<text class="mono xs m" x="624" y="333">$ deploy preview · exit 0</text>
<line class="wall wl" x1="166" y1="288" x2="280" y2="288"/>
<g class="pc"><rect class="chip" x="170" y="256" width="106" height="22" rx="4"/><text class="mono xs chipt" x="223" y="271" text-anchor="middle">paste token</text></g>
<g class="pr"><rect class="refused" x="170" y="256" width="106" height="22" rx="4"/><text class="mono xs m" x="223" y="271" text-anchor="middle">paste token</text><line class="strk ps" x1="178" y1="267" x2="268" y2="267"/></g>
<text class="xs bad rf" x="286" y="271">refused</text>
<g class="cap cap1"><circle class="badge" cx="32" cy="404" r="11"/><text class="badget" x="32" y="408" text-anchor="middle">1</text><text class="t sm" x="50" y="400">The repository declares</text><text class="t sm" x="50" y="417">its secrets by name.</text></g>
<g class="cap cap2"><circle class="badge" cx="250" cy="404" r="11"/><text class="badget" x="250" y="408" text-anchor="middle">2</text><text class="t sm" x="268" y="400">The shell resolves the key</text><text class="t sm" x="268" y="417">for one command alone.</text></g>
<g class="cap cap3"><circle class="badge" cx="468" cy="404" r="11"/><text class="badget" x="468" y="408" text-anchor="middle">3</text><text class="t sm" x="486" y="400">It vanishes as the command</text><text class="t sm" x="486" y="417">ends, and nothing keeps it.</text></g>
<g class="cap cap4"><circle class="badge" cx="686" cy="404" r="11"/><text class="badget" x="686" y="408" text-anchor="middle">4</text><text class="t sm" x="704" y="400">A token pasted into a file</text><text class="t sm" x="704" y="417">is refused.</text></g>
<text class="xs" x="20" y="452"><tspan class="t">secretspec</tspan><tspan class="m"> names each secret and resolves it from the password manager; </tspan><tspan class="t">sluice</tspan><tspan class="m"> gives a run nothing outside its place.</tspan></text>
