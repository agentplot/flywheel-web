.chip{fill:var(--accent)} .chipt{fill:var(--ink);font-weight:700}
.refused{fill:var(--panel);stroke:var(--bad);stroke-width:1.5}
.strk{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:120}
.wall{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
