<!-- Secrets by declaration: drawn for the Flywheel site's Method. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Secrets by declaration: an agent gets a secret only through the shell, for the task at hand</title>
<desc id="dsc">The repository's declaration, secretspec.toml, lists the secrets it needs by name and holds no value. An agent's command, deploy preview, runs inside the shell the repository declares. For that command alone, a key appears, resolved from the password manager, such as 1Password, and it vanishes when the command ends. Nothing reaches a file, the wider environment or the transcript. When the agent pastes a token into a file, it is refused. Here secretspec names each secret and resolves it from the password manager, while sluice gives the run nothing outside its place.</desc>
<style>
