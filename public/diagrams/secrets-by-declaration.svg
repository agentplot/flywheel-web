:0}}.kc{animation:k-kc 16s linear infinite}@keyframes k-cb{0%{transform:scaleX(0);fill:var(--accent);opacity:1} 18%{transform:scaleX(0);fill:var(--accent);opacity:1} 38.4%{transform:scaleX(1);fill:var(--accent);opacity:1} 39.2%{transform:scaleX(1);fill:var(--ok);opacity:1} 96%{transform:scaleX(1);fill:var(--ok);opacity:1} 96.8%{transform:scaleX(1);fill:var(--ok);opacity:0} 100%{transform:scaleX(0);fill:var(--accent);opacity:0}}.cb{animation:k-cb 16s linear infinite}@keyframes k-run{0%{opacity:0} 17.2%{opacity:0} 18%{opacity:1} 38.6%{opacity:1} 39.4%{opacity:0} 100%{opacity:0}}.run{animation:k-run 16s linear infinite}@keyframes k-ex{0%{opacity:0} 38.6%{opacity:0} 39.4%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.ex{animation:k-ex 16s linear infinite}@keyframes k-gn{0%{opacity:0} 41.2%{opacity:0} 42%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.gn{animation:k-gn 16s linear infinite}@keyframes k-eb{0%{stroke:var(--rule)} 45.2%{stroke:var(--rule)} 46%{stroke:var(--ok)} 96%{stroke:var(--ok)} 96.8%{stroke:var(--rule)} 100%{stroke:var(--rule)}}.eb{animation:k-eb 16s linear infinite}@keyframes k-en{0%{opacity:0} 45.2%{opacity:0} 46%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.en{animation:k-en 16s linear infinite}@keyframes k-fb{0%{stroke:var(--rule)} 48.2%{stroke:var(--rule)} 49%{stroke:var(--ok)} 96%{stroke:var(--ok)} 96.8%{stroke:var(--rule)} 100%{stroke:var(--rule)}}.fb{animation:k-fb 16s linear infinite}@keyframes k-fn{0%{opacity:0} 48.2%{opacity:0} 49%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.fn{animation:k-fn 16s linear infinite}@keyframes k-tb{0%{stroke:var(--rule)} 51.2%{stroke:var(--rule)} 52%{stroke:var(--ok)} 96%{stroke:var(--ok)} 96.8%{stroke:var(--rule)} 100%{stroke:var(--rule)}}.tb{animation:k-tb 16s linear infinite}@keyframes k-tn{0%{opacity:0} 51.2%{opacity:0} 52%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.tn{animation:k-tn 16s linear infinite}@keyframes k-pc{0%{transform:translate(150px,-34px);opacity:0} 66.6%{transform:translate(150px,-34px);opacity:0} 67%{transform:translate(150px,-34px);opacity:1} 71.4%{transform:translate(0px,0px);opacity:1} 72.2%{transform:translate(0px,0px);opacity:0} 100%{transform:translate(0px,0px);opacity:0}}.pc{animation:k-pc 16s linear infinite}@keyframes k-pr{0%{opacity:0} 71.4%{opacity:0} 72.2%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.pr{animation:k-pr 16s linear infinite}@keyframes k-ps{0%{stroke-dashoffset:120} 72.6%{stroke-dashoffset:120} 74.2%{stroke-dashoffset:0} 100%{stroke-dashoffset:0}}.ps{animation:k-ps 16s linear infinite}@keyframes k-wl{0%{opacity:0} 71.4%{opacity:0} 72.2%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.wl{animation:k-wl 16s linear infinite}@keyframes k-rf{0%{opacity:0} 72.2%{opacity:0} 73%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.rf{animation:k-rf 16s linear infinite}@keyframes k-cap1{0%{opacity:1} 11%{opacity:1} 11.8%{opacity:0.35} 99.2%{opacity:0.35} 100%{opacity:1}}.cap1{animation:k-cap1 16s linear infinite}@keyframes k-cap2{0%{opacity:0.35} 10.2%{opacity:0.35} 11%{opacity:1} 40%{opacity:1} 40.8%{opacity:0.35} 100%{opacity:0.35}}.cap2{animation:k-cap2 16s linear infinite}@keyframes k-cap3{0%{opacity:0.35} 39.2%{opacity:0.35} 40%{opacity:1} 65%{opacity:1} 65.8%{opacity:0.35} 100%{opacity:0.35}}.cap3{animation:k-cap3 16s linear infinite}@keyframes k-cap4{0%{opacity:0.35} 64.2%{opacity:0.35} 65%{opacity:1} 96%{opacity:1} 96.8%{opacity:0.35} 100%{opacity:0.35}}.cap4{animation:k-cap4 16s linear infinite}</style>
