# Every point here is a sample until the collector runs: `sample: true` marks
# it, and the page says so wherever it shows one. Collected points are
# appended without the flag, and the samples are deleted.
name: Tokens by role
summary: >
  What the fleet spends on tokens and where: by the role of the agent that
  spent them, and by the model it ran.
dimension: cost
definitionVersion: 1
definition: >
  Each day, every session Crew started is joined by its session id to its
  transcript. Its tokens are counted by kind (input, output, cache written,
  cache read) and priced in list-price dollars. Both are split by role
  (conductor, team ops, unit agent, design, planner, dispatcher, operator) and
  by model, per flywheel and in total. Dollars come from a dated rate table
  the site keeps, at the rates in force on the point's date; a price change
  dates the table, never the definition.
principle: measure-the-fleet
source: "`crew usage --json` over Crew's session registry and the transcripts' per-message usage"
collector: collectors/tokens-by-role
argues: >
  What the fleet costs and where: whether the spend sits with the agents that
  build or the ones that manage, and which model earns its price.
cannotShow: >
  It prices tokens at list rates, not at what a plan charges, and it counts
  what was spent, not what it bought: a costly day may land nothing.
chart: tokens
