# Every point here is a sample until the collector runs: `sample: true` marks
# it, and the page says so wherever it shows one. Collected points are
# appended without the flag, and the samples are deleted.
name: Landed
summary: >
  What the fleet delivers: the units merged into their bolt and the bolts
  landed on main, each day.
dimension: flow
definitionVersion: 1
definition: >
  Each day, from each flywheel's run record: the units merged into their
  bolt (work finished) and the bolts landed on main (work delivered). Both
  are counted, not sampled, per flywheel and in total.
principle: intents-and-bolts
source: "Crew's run record (`crew events`)"
collector: collectors/landed
argues: >
  What the fleet delivers, read against how busy it was. Small and lumpy at
  first, which the week's total absorbs.
cannotShow: >
  It counts what landed, not what it was worth: a one-line fix and a new
  feature are one unit each. A landing later reverted still counts on its
  day.
chart: landed
