# Every point here is a sample until the collector runs: `sample: true` marks
# it, and the page says so wherever it shows one. Collected points are
# appended without the flag, and the samples are deleted.
name: Work in flight
summary: >
  What the fleet is working on: the bolts open, the units in each stage, and
  how many repositories have work in flight.
dimension: flow
definitionVersion: 1
definition: >
  Every 5 minutes, from each flywheel's plan: the bolts open, the units in
  flight by stage (construct, awaiting approval, code, verify, merge), and
  the repositories with work in flight. Each day's value is the median of
  the day's samples, per flywheel and in total.
principle: intents-and-bolts
source: "Crew's plan (`crew bolts`)"
collector: collectors/work-in-flight
argues: >
  Where open work sits: a pile at awaiting approval is the attention
  bottleneck.
cannotShow: >
  It counts work, not its size: a bolt of one unit counts the same as a bolt
  of twenty. A unit may sit in a stage because it is blocked or because it
  is large.
chart: flight
