# Every point here is a sample until the collector runs: `sample: true` marks
# it, and the page says so wherever it shows one. Collected points are
# appended without the flag, and the samples are deleted.
name: Fleet utilization
summary: >
  How many agents the fleet is running and how many of them are working,
  like cores on a machine, with the host's load beside them.
dimension: health
definitionVersion: 1
definition: >
  Every 5 minutes on each fleet host: the agents alive, and how many of them
  are busy (working, as against waiting on the operator or idle). Beside
  them, the host's CPU and memory in use and its process count. Each day's
  value is the median of the day's samples, every sample counted; the agent
  counts also carry the day's peak. The busy share is busy divided by
  running at a point.
principle: measure-the-fleet
source: "`herdr agent list`; the host's process table"
collector: collectors/fleet-utilization
argues: >
  Idle agents are waste, like idle cores: the case for keeping the fleet fed.
cannotShow: >
  It counts agents and the load they put on the host, not what they produce.
  A busy agent may be looping on a failing test, so a full fleet is not yet a
  productive one.
chart: utilization
