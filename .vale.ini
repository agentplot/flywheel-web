# The house style. Rules start as suggestions or warnings; a rule that has been
# quiet for a while is promoted to error, and then it fails site-check.
StylesPath = styles
Vocab = Flywheel
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, Flywheel
# Spelling is off until the vocabulary has grown past the glossary.
Vale.Spelling = NO
# The honesty rules are for evidence, so they bind field notes only.
Flywheel.Absolutes = NO
Flywheel.UnsourcedNumber = NO

[src/content/notes/*.{md,mdx}]
BasedOnStyles = Vale, Flywheel
Vale.Spelling = NO
Flywheel.Absolutes = YES
Flywheel.UnsourcedNumber = YES
